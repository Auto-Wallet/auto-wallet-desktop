# Auto-lock settings and the activity heartbeat. The heartbeat is granted to the
# trusted local windows (shell, approval) only — NEVER to dapp: a page reporting
# its own "activity" would keep the wallet unlocked forever.
[[permission]]
identifier = "allow-note-user-activity"
description = "Allow a trusted local window to report user input so the idle auto-lock timer restarts."
commands.allow = ["note_user_activity"]

[[permission]]
identifier = "allow-get-auto-lock-minutes"
description = "Allow the shell to read the auto-lock idle timeout."
commands.allow = ["get_auto_lock_minutes"]

[[permission]]
identifier = "allow-set-auto-lock-minutes"
description = "Allow the shell to change the auto-lock idle timeout."
commands.allow = ["set_auto_lock_minutes"]
